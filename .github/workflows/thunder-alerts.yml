name: Thunder alerts

on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes (GitHub may run it late when busy)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to save notified.json back to the repo

concurrency:
  group: thunder-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Check Thunder games
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TZ: America/New_York  # so tip-off times show in your local time
        run: python3 thunder_alerts.py

      - name: Save notified.json
        run: |
          if ! git diff --quiet notified.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update notified games" notified.json
            git push
          fi
